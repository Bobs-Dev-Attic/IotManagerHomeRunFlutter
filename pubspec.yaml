name: iot_manager
description: A unified IoT device manager for TP-Link Kasa, GE Cync, and Leviton devices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3

  # HTTP client
  dio: ^5.4.0

  # mDNS / Zeroconf discovery
  bonsoir: ^5.1.0

  # Network connectivity
  connectivity_plus: ^5.0.2

  # Local cache (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Utilities
  uuid: ^4.3.3
  intl: ^0.18.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
